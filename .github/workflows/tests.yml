name: Tests

# Runs the tests and checks the dependencies for known vulnerabilities
# on every push to main and on every pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy  # no screen on the CI machine
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - name: Install Python and the locked dependencies
        run: uv sync --locked
      - name: Run the tests
        run: uv run pytest -q
      - name: Check the dependencies for known vulnerabilities
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project > requirements.txt
          uvx --from pip-audit==2.7.3 pip-audit -r requirements.txt
