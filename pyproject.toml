[project]
name = "cp-controller-game"
version = "0.1.0"
description = "Railway signalling game: keep the trains on the Algarve line running on time."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
